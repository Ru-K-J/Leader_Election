apiVersion: v1
kind: Pod
metadata:
  name: p1
  labels:
    app: bully-improved
    process: p1
spec:
  containers:
    - name: p1
      image: bully-improved:latest
      imagePullPolicy: Never
      args: ["1"]
      stdin: true
      tty: true

---
apiVersion: v1
kind: Service
metadata:
  name: p1
spec:
  selector:
    process: p1
  ports:
    - port: 5001
      targetPort: 5001

